name: CI

on:
  # No base-branch filter on pull_request. With `branches: [main, master]` a
  # stacked pull request - one whose base is another feature branch - runs
  # nothing at all and shows every job as skipped, which reads like a pass. That
  # is how an unchecked change reached main in the app repository; the app and
  # the relay both dropped the filter after it. (TODO-288, TODO-263)
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Tests never ran in CI, so nothing caught helpers.test.ts failing to even
      # import on Node 18/20 — it was only noticed by running them by hand during
      # a release. (TODO-229)
      - name: Test
        run: npm test

      - name: Check dist exists
        run: |
          test -f dist/index.js || (echo "dist/index.js not found" && exit 1)
          echo "Build successful!"
